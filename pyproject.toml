[build-system]
build-backend = "hatchling.build"
# `jax` is a build requirement, not only a runtime one: the build hook compiles the
# exact-affine FFI kernel against the XLA FFI headers that ship inside jaxlib, and
# locates them through `jax.ffi.include_dir()`.
requires = [ "hatch-vcs", "hatchling", "jax>=0.11" ]

[project]
name = "pylcm"
description = "Specification, solution, and simulation of finite-horizon dynamic choice models."
keywords = [
  "Dynamic programming",
  "Econometrics",
  "Economics",
  "Estimation",
  "Life cycle models",
  "Statistics",
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "beartype>=0.22",
  "cloudpickle>=3.1.2",
  "dags>=0.6",
  "h5py>=3.12",
  "jax>=0.11",
  "jaxtyping>=0.3.11",
  "orbax-checkpoint>=0.11",
  "pandas",
  "portion>=2.6",
  "pyarrow",
]
[project.readme]
content-type = "text/markdown"
file = "README.md"
[project.license]
file = "LICENSE"
[[project.maintainers]]
name = "Tim Mensinger"
email = "mensingertim@gmail.com"

[[project.maintainers]]
name = "Hans-Martin von Gaudecker"
email = "hmgaudecker@uni-bonn.de"
[[project.authors]]
name = "Tim Mensinger"
email = "mensingertim@gmail.com"

[[project.authors]]
name = "Maximilian Jahn"

[[project.authors]]
name = "Janos Gabler"

[[project.authors]]
name = "Hans-Martin von Gaudecker"
email = "hmgaudecker@uni-bonn.de"
[project.urls]
Github = "https://github.com/opensourceeconomics/pylcm"
Repository = "https://github.com/opensourceeconomics/pylcm"
Tracker = "https://github.com/opensourceeconomics/pylcm/issues"

[tool.hatch]
version.source = "vcs"
metadata.allow-direct-references = true
# The compiled kernels are gitignored, so they have to be named explicitly or
# hatchling's VCS-based file selection would leave them out of the wheel.
build.artifacts = [ "src/_lcm/egm/upper_envelope/_exact_affine/*.so" ]
build.hooks.vcs.version-file = "src/_lcm/version.py"
build.targets.wheel.hooks.custom.path = "hatch_build.py"
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-arm64",
  "win-64",
  { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
  { name = "linux-64-cuda13", platform = "linux-64", cuda = "13" },
  { name = "linux-aarch64-cuda13", platform = "linux-aarch64", cuda = "13" },
]
[tool.pixi.dependencies]
asv = "*"
python = "~=3.14.0"
cloudpickle = ">=3.1.2,<4"
h5py = ">=3.12"
jupyterlab = "*"
memory_profiler = "*"
numpy = ">=2.4,<2.5"
plotly = ">=6.5"
prek = "*"
pyarrow = "*"
pybaum = "*"
scipy = ">=1.16"
snakeviz = "*"
[tool.pixi.pypi-dependencies]
jax = ">=0.11"
pdbp = "*"
pylcm = { path = ".", editable = true }
[tool.pixi.tasks]
asv-compare = "asv compare"
asv-preview = "asv preview"
asv-pr-comment = "python benchmarks/pr_comment.py"
asv-publish = "python benchmarks/publish.py"
asv-quick = { cmd = "asv run --quick --set-commit-hash=$(git rev-parse HEAD)", env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false" } }
asv-run = { cmd = 'git status --porcelain --ignore-submodules | grep -q . && echo "Refusing to benchmark: worktree is dirty. Commit first." && exit 1; asv run -v --show-stderr --set-commit-hash=$(git rev-parse HEAD)', env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false" } }
asv-run-and-pr-comment = { depends-on = [ "asv-run", "asv-pr-comment" ] }
asv-run-and-publish-main = { depends-on = [ "asv-run", "asv-publish" ] }
# Recompile the certified path's exact-affine kernel in place. An editable install
# builds it once; rerun this after editing the C++ or CUDA sources. Set NVCCFLAGS
# (e.g. '-arch=sm_80') to pick the CUDA target architecture.
build-exact-affine = "python hatch_build.py"
[tool.pixi.feature.benchmarks.pypi-dependencies]
# Pinned to an aca-model main that carries both the keyword-only case-piece
# call sites this branch's API requires and the DC-EGM solver path; flip back
# to `branch = "main"` once this branch merges.
aca-model = { git = "https://github.com/OpenSourceEconomics/aca-model.git", rev = "1409be36072ac49efc5b5e56cab0ac611d2dd1dc" }
[tool.pixi.feature.cuda12]
platforms = [ "linux-64-cuda12" ]
[tool.pixi.feature.cuda12.target.linux-64.dependencies]
cuda-nvcc = "~=12.0"
[tool.pixi.feature.cuda12.target.linux-64.pypi-dependencies]
jax = { version = ">=0.11", extras = [ "cuda12" ] }
[tool.pixi.feature.cuda13]
platforms = [ "linux-64-cuda13", "linux-aarch64-cuda13" ]
[tool.pixi.feature.cuda13.target.linux-64.dependencies]
cuda-nvcc = "~=13.0"
[tool.pixi.feature.cuda13.target.linux-64.pypi-dependencies]
jax = { version = ">=0.11", extras = [ "cuda13" ] }
[tool.pixi.feature.cuda13.target.linux-aarch64.dependencies]
cuda-nvcc = "~=13.0"
[tool.pixi.feature.cuda13.target.linux-aarch64.pypi-dependencies]
jax = { version = ">=0.11", extras = [ "cuda13" ] }
[tool.pixi.feature.docs.dependencies]
jupyter-book = ">=2.0"
mystmd = "*"
[tool.pixi.feature.docs.pypi-dependencies]
quantecon = "*"
[tool.pixi.feature.docs.tasks]
build-docs = { cmd = "jupyter book build --html --execute", cwd = "docs", env = { JAX_PLATFORMS = "cpu" } }
explanation-notebooks = "jupyter execute docs/explanations/*.ipynb"
view-docs = { cmd = "jupyter book start --execute", cwd = "docs", env = { JAX_PLATFORMS = "cpu" } }
[tool.pixi.feature.tests-pro-py313]
# Replicates the external reviewer's air-gapped container so a bundle can be
# tested against the interpreter and libraries that will actually run it, rather
# than against ours. It carries `no-default-feature`, so it deliberately has no
# pylcm install and therefore no beartype, jaxtyping or dags — their absence is
# the condition being reproduced. Point PYTHONPATH at a transformed bundle tree.
#
# Absences are as load-bearing as the pins. `pyarrow` in particular is confirmed
# missing there, which is what makes every committed `.pkl` fixture holding a
# pyarrow-backed string column unreadable for the reviewer — so a bundle ships
# tests that build their own inputs, never ones that read a stored frame. Adding
# any of pyarrow, orbax, h5py, quantecon or beartype here would quietly restore a
# capability the reviewer does not have and make a green run mean nothing.
platforms = [ "linux-64" ]
[tool.pixi.feature.tests-pro-py313.dependencies]
# Reported by the reviewer for /opt/pyvenv/bin/python.
python = "==3.13.5"
pandas = "==2.2.3"
networkx = "==3.6.1"
# Not yet reported by the reviewer; left unpinned rather than guessed. Pin each
# one as its version is confirmed — an invented pin reproduces our environment
# under another name.
numpy = "*"
pytest = "*"
[tool.pixi.feature.tests-pro-py313.pypi-dependencies]
jax = "==0.9.0.1"
[tool.pixi.feature.tests.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-timeout = "*"
pytest-xdist = "*"
py-spy = ">=0.4.2,<0.5"
[tool.pixi.feature.tests.pypi-dependencies]
quantecon = "*"
[tool.pixi.feature.tests.tasks]
# Run the suite across 4 xdist workers (`--dist loadfile` in addopts keeps each
# file on one worker). `XLA_PYTHON_CLIENT_PREALLOCATE=false` is a no-op on CPU but
# required on GPU: it stops each of the 4 worker processes from preallocating ~75%
# of the device and OOMing — they grow to their actual (small) per-test need
# instead, and `loadfile` keeps the one heavy file (Mahler-Yum) on a single worker.
#
# `-v` and `--junitxml` are not decoration. The JUnit report is written when the run
# ends, so a run that is killed part-way leaves none; `-v` has by then already streamed
# one line per test, which is the only record such a run leaves behind. Together they
# give a count that is complete by construction when the run finishes and an
# attributable partial record when it does not. `reports/` is gitignored.
tests = { cmd = "pytest tests -n 4 -v --junitxml=reports/tests.xml", env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false" } }
tests-32bit = { cmd = "pytest tests --precision=32 -n 4 -v --junitxml=reports/tests-32bit.xml", env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false" } }
tests-with-cov = { cmd = "pytest tests --cov-report=xml --cov=./ -n 4 -v --junitxml=reports/tests-with-cov.xml", env = { XLA_PYTHON_CLIENT_PREALLOCATE = "false" } }
[tool.pixi.feature.type-checking.dependencies]
# The env ty analyzes against (`[tool.ty] environment.python`); the ty binary
# itself is managed by the `ty` pre-commit hook (`prek run ty --all-files`).
matplotlib = "*"
pandas-stubs = "*"
scipy-stubs = "*"
[tool.pixi.environments]
benchmarks-cuda12 = { features = [ "benchmarks", "cuda12" ], solve-group = "cuda12" }
cuda12 = { features = [ "cuda12" ], solve-group = "cuda12" }
cuda13 = { features = [ "cuda13" ], solve-group = "cuda13" }
docs = { features = [ "docs" ], solve-group = "default" }
tests-pro-py313 = { features = [ "tests-pro-py313" ], no-default-feature = true }
tests-cpu = { features = [ "tests" ], solve-group = "default" }
tests-cuda12 = { features = [ "tests", "cuda12" ], solve-group = "cuda12" }
tests-cuda13 = { features = [ "tests", "cuda13" ], solve-group = "cuda13" }
type-checking = { features = [ "type-checking", "tests" ], solve-group = "default" }

[tool.ruff]
target-version = "py314"
exclude = [ "src/lcm/sandbox" ]
fix = true
unsafe-fixes = false
[tool.ruff.lint]
select = [ "ALL" ]
extend-ignore = [
  "COM812",  # Conflicts with ruff-format
  "CPY001",  # Missing copyright notice
  "D",       # Docstrings
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "FIX002",  # Line contains TODO
  "ISC001",  # Conflicts with ruff-format
  "N802",    # Function name should be lowercase
  "N803",    # Argument name should be lowercase
  "N806",    # Variable in function should be lowercase
  "N815",    # Variable in class scope should not be mixedCase
  "PLR0913", # Too many arguments in function definition
  "PLR0917", # Too many positional arguments
  "TC001",   # Move application import into a type-checking block
  "TC002",   # Move third-party import into a type-checking block
  "TC003",   # Move standard library import into a type-checking block
  "TRY003",  # Long messages outside exception class
  "UP047",   # Generic function should use type parameters
  "F722",    # https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
]
per-file-ignores."benchmarks/*" = [
  "ANN",     # Annotations
  "ARG002",  # Unused method argument (ASV passes params to all methods)
  "BLE001",  # Blind exception
  "D",       # Docstrings
  "INP001",  # Implicit namespace package
  "PLC0415", # import not at top level
  "PLR2004", # Magic values in comparison
  "PLW1510", # subprocess.run without explicit check
  "RUF012",  # Mutable class attribute (ASV requires list `params`/`param_names`)
  "S101",    # Use of assert
  "SIM108",  # Ternary operator
  "S603",    # subprocess call without shell=True check
  "S607",    # Partial executable path
  "T201",    # print found
]
per-file-ignores."docs/**/*" = [
  "ANN001", # Missing type annotation for function argument
  "ANN002", # Missing type annotation for *args
  "ANN003", # Missing type annotation for **kwargs
  "ANN201", # Missing return type annotation for public function
  "ANN202", # Missing return type annotation for private function
  "ARG001", # Unused function argument
  "D100",   # Missing docstring in public module
  "D103",   # Missing docstring in public function
  "D104",   # Missing docstring in public package
  "PD011",  # Use `.to_numpy()` — false positive on JAX .values
  "S101",   # Use of assert
  "RUF001", # Ambiguous Unicode characters (Greek letters in plot titles)
  "T201",   # print found
  "T203",   # pprint found
]
per-file-ignores."explanations/*" = [
  "ANN",    # Annotations
  "E402",   # Module level import not at top of file
  "INP001", # Implicit namespace package
  "T201",   # print found
  "T203",   # pprint found
]
per-file-ignores."src/_lcm/utils/functools.py" = [
  "ANN401", # Dynamically typed expressions (Any)
]
per-file-ignores."src/_lcm/**/*[A-Z]*.py" = [
  "N999", # Module name mixing uppercase and lowercase (Q_and_F.py, V.py, max_Q_over_a.py)
]
per-file-ignores."src/lcm_examples/mahler_yum_2024/**" = [
  "PD008", # false positive on JAX `.at[].set()` immutable updates
  "PD011", # false positive on `AgeGrid.values`
]
per-file-ignores."tests/*" = [
  "ANN",     # Annotations
  "D",       # Docstrings
  "INP001",  # Implicit namespace package
  "N999",    # Module name mixing uppercase and lowercase
  "PLR2004", # Magic values in comparison
  "S101",    # Use of assert
  "S301",    # Use of pickle
  "SLF001",  # Private member access
]
per-file-ignores."tests/solution/test_egm_interp.py" = [
  "ARG001", # Unused function argument (x64_enabled fixture)
]
per-file-ignores."tests/test_certainty_equivalent.py" = [
  "ARG001", # Unused function argument (x64_enabled / x64_disabled fixtures)
]
per-file-ignores."tests/test_koopmans_aggregation.py" = [
  "ARG001", # Unused function argument (x64_enabled fixture)
]
per-file-ignores."tests/test_compilation_cache.py" = [
  "S603", # subprocess call with test-controlled input
]
per-file-ignores."tests/test_distributed.py" = [
  "S603", # subprocess call with test-controlled input
]
per-file-ignores."tests/test_dtypes.py" = [
  "ARG001", # Unused function argument (x64_enabled / x64_disabled fixtures)
]
per-file-ignores."tests/test_explicit_dtype_filter.py" = [
  "ARG001", # Unused function argument (x64_disabled fixture)
]
per-file-ignores."tests/test_float_dtype_invariants.py" = [
  "ARG001", # Unused function argument (x64_disabled fixture)
]
per-file-ignores."tests/test_next_state.py" = [
  "ARG001", # Unused function argument
  "ARG005", # Unused lambda argument
  "E731",   # Do not assign a `lambda` expression, use a `def`
]
per-file-ignores."tests/test_Q_and_F.py" = [
  "ARG001", # Unused function argument
  "ARG005", # Unused lambda argument
  "E731",   # Do not assign a `lambda` expression, use a `def`
]
per-file-ignores."tests/test_temporal_aggregation.py" = [
  "ARG001", # Unused function argument (x64_enabled fixture)
]
pydocstyle.convention = "google"
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "_lcm.certainty_equivalent.LinearExpectation",
  "_lcm.utils.containers.Unset",
  "lcm.LinearExpectation",
  "lcm.LinearAggregator",
  "lcm.certainty_equivalent.LinearExpectation",
  "lcm.koopmans_aggregation.LinearAggregator",
  "LinearAggregator",
  "LinearExpectation",
  "Unset",
]
[tool.ruff.lint.isort]
known-first-party = [ "_lcm", "lcm", "lcm_examples", "tests" ]

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.14"
table_format = "long"
expand_tables = [
  "tool.pixi.dependencies",
  "tool.pixi.environments",
  "tool.pixi.feature.tests.pypi-dependencies",
  "tool.pixi.feature.tests.tasks",
  "tool.pixi.feature.type-checking.dependencies",
  "tool.pixi.pypi-dependencies",
  "tool.pixi.tasks",
  "tool.pixi.workspace",
]
collapse_tables = [ "tool.hatch", "tool.pytask", "tool.pytest", "tool.ty" ]

[tool.ty]
src.include = [ "docs/", "src/", "tests/" ]
# ty resolves third-party imports from this pixi env (the ty-pre-commit hook runs
# `uv check --no-project`, so uv neither creates a `.venv` nor resolves deps). Run
# `pixi install` once.
environment.python = ".pixi/envs/type-checking"
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.ignore-comment-unknown-rule = "error"
rules.ineffective-final = "error"
rules.invalid-enum-member-annotation = "error"
rules.invalid-ignore-comment = "error"
rules.invalid-legacy-positional-parameter = "error"
rules.redundant-cast = "error"
rules.unused-awaitable = "error"
rules.unused-ignore-comment = "error"

[tool.pytest]
ini_options.norecursedirs = [ "docs" ]
ini_options.addopts = [
  "--pdbcls=pdbp:Pdb",
  "--dist",
  "loadfile",
  # Deselect the `manual` gates by default. A command-line `-m` overrides this
  # one (pytest keeps the last `-m` it sees), so `pytest ... -m manual` still
  # runs them.
  #
  # That override is why this line cannot be the whole mechanism: `-m` on the
  # command line REPLACES this expression wholesale rather than intersecting
  # with it, so any caller passing its own `-m` silently drops `not manual`.
  #
  # The two markers answer different questions and stack rather than compete:
  #
  #   slow   — too heavy for the small CI runners. Dropped on macOS/Windows and
  #            split into its own phases on Linux, where it still runs.
  #   manual — solves the real paper-scale model. Runs nowhere in CI, on any
  #            runner, at any budget.
  #
  # The Mahler-Yum gates are both, and carry both marks. Neither mark implies
  # the other in general — a `manual` gate need not be `slow`, and most `slow`
  # tests are not `manual` — so CI cannot lean on one to exclude the other.
  # Every `cpu.yml` invocation therefore states `not manual` itself, whichever
  # side of `slow` it wants: `-m "not slow and not manual"` for the fast phases,
  # `-m "slow and not manual"` for the heavy ones. That is an invariant of the
  # workflow, not an artifact of how today's gates happen to be marked.
  "-m",
  "not manual",
]
ini_options.markers = [
  "gpu: Tests that require a GPU (skipped on CPU-only machines)",
  "illustrative: Tests are designed for illustrative purposes",
  "manual: gates that solve the real paper-scale model; run on request, never in CI",
  "requires_exact_affine_kernel: requires the selected backend's exact-affine kernel",
  "skipif_cpu: skip test when the JAX backend is CPU",
  "slow: heavy DC-EGM solve/oracle tests (deselected on small runners)",
]
ini_options.filterwarnings = [
  # JAX emits this UserWarning when user code asks for a dtype wider
  # than the active x64 setting allows. Under `--precision=32` it
  # surfaces every stray `jnp.int64` / `jnp.float64` / `dtype=int64`
  # literal in src/ — the only files that legitimately trigger it are
  # the dtype-invariant test modules, which opt out via a local
  # `pytestmark` filter.
  "error:Explicitly requested dtype.*:UserWarning",
]

[tool.yamlfix]
line_length = 88
none_representation = "null"
sequence_style = "block_style"
