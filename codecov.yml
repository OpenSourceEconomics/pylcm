---
codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 4
comment:
  after_n_builds: 4
coverage:
  precision: 2
  round: down
  range: 50...100
  status:
    patch:
      default:
        target: 70%
    project:
      default:
        target: 90%
flags:
  cpu-python:
    after_n_builds: 4
    carryforward: false
ignore:
  - tests/**/*
