---
name: superseded
description: >-
  Report whether a newer run of this workflow on the same branch exists, i.e. the
  current run was cancelled because the concurrency group replaced it.
outputs:
  superseded:
    description: '`true` when a newer run of this workflow on this branch exists.'
    value: ${{ steps.check.outputs.superseded }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |-
        repo="repos/${GITHUB_REPOSITORY}/actions"
        workflow_id=$(gh api "${repo}/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
        newer=$(
          gh api "${repo}/workflows/${workflow_id}/runs?branch=${BRANCH}" \
            --jq "[.workflow_runs[] | select(.id > ${GITHUB_RUN_ID})] | length"
        )
        echo "newer runs on ${BRANCH}: ${newer}"
        superseded=false
        if test "${newer}" -gt 0; then superseded=true; fi
        echo "superseded=${superseded}" >> "$GITHUB_OUTPUT"
