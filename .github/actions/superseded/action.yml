---
name: superseded
description: >-
  Report whether a newer pull-request run of this workflow for the same head
  (same head repository and branch) exists, i.e. the current run was cancelled
  because the concurrency group replaced it.
outputs:
  superseded:
    description: >-
      `true` only for a pull-request run when a newer run of this workflow from
      the same head repository and branch exists.
    value: ${{ steps.check.outputs.superseded }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |-
        superseded=false
        if test "${GITHUB_EVENT_NAME}" = pull_request; then
          repo="repos/${GITHUB_REPOSITORY}/actions"
          run="${repo}/runs/${GITHUB_RUN_ID}"
          workflow_id=$(gh api "${run}" --jq .workflow_id)
          head_repo=$(gh api "${run}" --jq .head_repository.full_name)
          runs="${repo}/workflows/${workflow_id}/runs"
          same_head="select(.id > ${GITHUB_RUN_ID}"
          same_head+=" and .event == \"pull_request\""
          same_head+=" and .head_repository.full_name == \"${head_repo}\")"
          newer=$(
            gh api "${runs}?branch=${BRANCH}&event=pull_request" \
              --jq "[.workflow_runs[] | ${same_head}] | length"
          )
          echo "newer runs from ${head_repo}:${BRANCH}: ${newer}"
          if test "${newer}" -gt 0; then superseded=true; fi
        fi
        echo "superseded=${superseded}" >> "$GITHUB_OUTPUT"
