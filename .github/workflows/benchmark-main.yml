---
name: benchmark-main
concurrency:
  group: gpu-benchmarks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
on:
  push:
    branches:
      - main
jobs:
  run-benchmarks:
    name: Run benchmarks on GPU and publish to open-econ.org/pylcm-benchmarks
    timeout-minutes: 14400  # 10 days (max is 35790 for self-hosted)
    runs-on:
      - self-hosted
      - gpu-benchmark
    steps:
      # See benchmark-pr.yml: `/tmp` is on a small root filesystem on the
      # benchmark runner, so keep temporary files on the runner's work volume.
      # It has to be a step, not a job-level `env:` — the `runner` context is
      # unavailable there and using it makes GitHub reject the file at parse
      # time. `RUNNER_TEMP` is a plain environment variable on the runner.
      - name: Send temporary files to the runner's work volume
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Report free disk space
        run: df -h "$TMPDIR" /tmp / | cat
      - name: Wait for GPU to be free
        run: |
          echo "Waiting for GPU to be free..."
          while nvidia-smi --query-compute-apps=process_name --format=csv,noheader \
                | grep -qi python; do
            echo "$(date): GPU in use by Python process, retrying in 60s..."
            sleep 60
          done
          echo "GPU is free."
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install environment
        run: pixi install -e benchmarks-cuda12
      - name: Regenerate version.py
        run: >-
          echo "__version__ = '$(git describe --tags --always)'"
          > src/_lcm/version.py
      - name: Setup ASV machine
        run: pixi run -e benchmarks-cuda12 asv machine --yes
      - name: Run benchmarks and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run -e benchmarks-cuda12 asv-run-and-publish-main
