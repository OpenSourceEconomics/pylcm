---
name: benchmark-pr
concurrency:
  group: gpu-benchmarks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - '**.md'
      - '**.ipynb'
  workflow_dispatch: null
jobs:
  run-benchmarks:
    name: Run benchmarks on GPU and make PR comment
    timeout-minutes: 14400  # 10 days (max is 35790 for self-hosted)
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - gpu-benchmark
    steps:
      # On the benchmark runner `/tmp` sits on a small root filesystem, while the
      # runner's own work volume has hundreds of GB free. The benchmarks write
      # hundreds of MB of debug-log snapshots per run, which filled the root
      # filesystem and failed three branches' jobs with ENOSPC. Keep temporary
      # files on the big volume.
      #
      # This has to be a step rather than a job-level `env:`: the `runner`
      # context is not available when job-level env is evaluated, and using it
      # there makes GitHub reject the whole file at parse time. `RUNNER_TEMP` is
      # a plain environment variable on the runner, so no expression is needed.
      - name: Send temporary files to the runner's work volume
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Report free disk space
        run: df -h "$TMPDIR" /tmp / | cat
      # The benchmark machine runs several runner slots on one GPU, and the
      # concurrency group is per branch, so benchmark jobs of different pull
      # requests can start together. A machine-wide lock, taken here and held
      # until the job ends, runs them one after another. The `nvidia-smi` poll
      # below only guards against GPU work started outside these jobs: it cannot
      # see a job that is still installing its environment.
      - name: Hold the benchmark GPU for this whole job
        run: |
          held="$RUNNER_TEMP/gpu-lock-held"
          rm -f "$held"
          nohup flock /tmp/pylcm-gpu-benchmark.lock \
            sh -c 'touch "$0" && exec sleep infinity' "$held" \
            > /dev/null 2>&1 &
          echo "GPU_LOCK_PID=$!" >> "$GITHUB_ENV"
          until test -e "$held"; do
            echo "$(date): another benchmark job holds the GPU, retrying in 30s..."
            sleep 30
          done
          echo "GPU lock held."
      - name: Wait for GPU to be free
        run: |
          echo "Waiting for GPU to be free..."
          while nvidia-smi --query-compute-apps=process_name --format=csv,noheader \
                | grep -qi python; do
            echo "$(date): GPU in use by Python process, retrying in 60s..."
            sleep 60
          done
          echo "GPU is free."
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure main ref exists
        run: git branch --force main origin/main
      - name: Regenerate version.py
        run: >-
          echo "__version__ = '$(git describe --tags --always)'"
          > src/_lcm/version.py
      - name: Select the runner's actual CUDA architecture
        shell: bash
        run: |
          capability=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader \
            | head -n 1 | tr -d '.')
          test -n "$capability"
          echo "NVCCFLAGS=-arch=sm_${capability}" >> "$GITHUB_ENV"
      - name: Restore or install the benchmark environment
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          pixi-bin-path: ${{ runner.temp }}/pixi-bin/pixi
          cache: true
          cache-write: false
          environments: benchmarks-cuda12
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          set +e
          pixi run -e benchmarks-cuda12 python -m tests.ci.probe_native \
            --report=reports/native-benchmark.json
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e benchmarks-cuda12 --locked pylcm
            pixi run -e benchmarks-cuda12 python -m tests.ci.probe_native \
              --report=reports/native-benchmark.json
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Setup ASV machine
        run: pixi run -e benchmarks-cuda12 asv-machine
      - name: Verify external benchmark compatibility
        run: pixi run -e benchmarks-cuda12 asv-preflight
      - name: Run benchmarks and post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pixi run -e benchmarks-cuda12 asv-run-and-pr-comment
      # Runs even when an earlier step fails or the job is cancelled. Killing
      # the lock holder's child as well closes every copy of the lock file.
      - name: Release the benchmark GPU
        if: always()
        run: |-
          if test -n "${GPU_LOCK_PID:-}"; then
            pkill -P "$GPU_LOCK_PID" || true
            kill "$GPU_LOCK_PID" 2> /dev/null || true
          fi
