---
name: notebooks
# Automatically cancel a previous run.
concurrency:
  group: notebooks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
# No path filter. The explanation notebooks are pages of the documentation site
# (`docs/myst.yml` lists them), so they must run when a notebook itself changes —
# and they import `lcm`, so they must run when the library changes too. That leaves
# nothing worth excluding, and as a required check it has to report on every PR.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
jobs:
  run:
    name: Run explanation notebooks for docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: docs
          frozen: false
      - name: Build the exact-affine kernel
        # `hatch_build.py` compiles against the XLA FFI headers of whichever jax
        # it runs beside (`jax.ffi.include_dir()`), so the handler's API version is
        # fixed when the library is built. The kernel is a gitignored build
        # artifact, and `pixi install` rebuilds it only when it decides the
        # editable package needs reinstalling -- so without this step the library
        # and the jax that loads it are chosen at two independent moments, and a
        # handler whose API version the running framework rejects fails the first
        # notebook to ask for a certified verdict. Building here pins both to this
        # environment.
        run: pixi run -e docs build-exact-affine
      - name: Run explanation notebooks
        shell: bash {0}
        run: pixi run -e docs explanation-notebooks
  # A required status check matches by exact check-run name, and `name:` above
  # overrides what gets reported -- so branch protection's context `notebooks`
  # never matched `Run explanation notebooks for docs` and sat "Expected --
  # Waiting for status to be reported" forever, even after `run` passed.
  # Mirrors `cpu`'s gate job in cpu.yml, which is why that one already worked.
  notebooks:
    name: notebooks
    needs:
      - run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the check succeeded
        run: |-
          echo "run: ${{ needs.run.result }}"
          test "${{ needs.run.result }}" = "success"
