  # The exact-kernel capability matrix is a per-platform build property, not a
  # per-shard one: it ran once per OS before the general lanes were sharded and
  # still runs once per OS now, rather than three times.
  tests-exact-kernel:
    name: Run the exact-kernel capability matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Activate the MSVC developer environment
        # Must precede `setup-pixi`. Installing the project editable runs the
        # hatch build hook, which compiles the kernel and fails when no C++
        # compiler is on PATH -- on every platform, not only this one. Putting
        # the activation after the install leaves `cl.exe` absent for the one
        # step that needs it, so the environment never finishes building.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          pylcm_native_report="reports/native.json"
          set +e
          pixi run -e tests-cpu python -m tests.ci.probe_native \
            --report="$pylcm_native_report"
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cpu --locked pylcm
            pixi run -e tests-cpu python -m tests.ci.probe_native \
              --report="$pylcm_native_report"
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Run the fp64 exact-kernel capability matrix
        if: runner.os == 'Linux'
        shell: bash {0}
        run: >-
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py
          --precision=64 --output-dir=reports
      - name: Run the Windows exact-kernel capability matrix
        if: runner.os == 'Windows'
        # Both precisions run even when the first fails, because each arm's
        # report is evidence about a different build; the step then fails if
        # either did. A bare `bash {0}` template has neither `-e` nor a status
        # of its own beyond the last command's, so without the explicit exit a
        # failing fp32 arm is reported as success whenever fp64 passes.
        shell: bash {0}
        run: |
          rc=0
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py \
            --precision=32 --output-dir=reports || rc=1
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py \
            --precision=64 --output-dir=reports || rc=1
          exit "$rc"
      - name: Run the fp32 exact-kernel capability matrix
        if: runner.os == 'Linux'
        shell: bash {0}
        run: >-
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py
          --precision=32 --output-dir=reports
      - name: Upload exact-kernel capability diagnostics
        # Kept out of the JUnit artifacts on purpose. The matrix's `broken` arm
        # is required to produce a failing testcase -- that failure is the
        # positive control proving the detector fires -- so pooling its report
        # with the suite's would put a failure and extra arms per precision into
        # the counts a healthy run reports.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exact-kernel-matrix-${{ runner.os }}
          path: |
            reports/junit-exact-kernel-matrix-*.xml
            reports/exact-kernel-skips-*.json
            reports/exact-kernel-matrix-*.log
          if-no-files-found: warn
  # The slow solution phase dominates both CPU precisions. Whole files are
  # assigned by decreasing observed per-precision weight into the lightest bin
  # (`shard_test_files.py --weights-leg`), preserving module-local compile reuse
  # while balancing real cost rather than a hash. Both precisions take seven
  # shards. Run 35078533997 measured 288.5 worker-minutes at fp64 and 285.4 at
  # fp32, so a two-worker job carries 20.6 and 20.4 payload minutes at seven
  # shards; fewer shards break the 24-minute payload guardrail and more buy
  # nothing, because the heaviest indivisible file already costs 21.1 minutes at
  # fp64 and 22.1 at fp32 and `--dist loadfile` cannot split it. Each job keeps
  # two xdist workers: increasing that inside a 16 GB runner has exhausted
  # memory, whereas separate runners provide real capacity.
  tests-slow-solution:
    name: >-
      Run slow solution tests on ubuntu-latest at fp${{ matrix.precision }}
      (shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - precision: 64
            shard: 1
            shards: 7
          - precision: 64
            shard: 2
            shards: 7
          - precision: 64
            shard: 3
            shards: 7
          - precision: 64
            shard: 4
            shards: 7
          - precision: 64
            shard: 5
            shards: 7
          - precision: 64
            shard: 6
            shards: 7
          - precision: 64
            shard: 7
            shards: 7
          - precision: 32
            shard: 1
            shards: 7
          - precision: 32
            shard: 2
            shards: 7
          - precision: 32
            shard: 3
            shards: 7
          - precision: 32
            shard: 4
            shards: 7
          - precision: 32
            shard: 5
            shards: 7
          - precision: 32
            shard: 6
            shards: 7
          - precision: 32
            shard: 7
            shards: 7
    env:
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      PYLCM_CI_PRECISION: ${{ matrix.precision }}
      PYLCM_CI_SHARD: ${{ matrix.shard }}
      PYLCM_CI_SHARDS: ${{ matrix.shards }}
      PYLCM_CI_RECEIPT: reports/ci-receipts
      PYLCM_CACHE_KEY: jax-sol-fp${{ matrix.precision }}-s${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          pylcm_native_report="reports/native.json"
          set +e
          pixi run -e tests-cpu python -m tests.ci.probe_native \
            --report="$pylcm_native_report"
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cpu --locked pylcm
            pixi run -e tests-cpu python -m tests.ci.probe_native \
              --report="$pylcm_native_report"
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Cache JAX compiled programs
        # `setup-pixi` caches the environment but not JAX's persistent
        # compilation cache, so every job recompiles every program from cold.
        # Safe because JAX keys an entry on the computation, the backend and its
        # own version, so a stale or torn entry misses rather than misleads.
        # `github.sha` makes each run write a fresh entry while `restore-keys`
        # starts it from the nearest earlier one, so the cache follows the
        # branch instead of freezing at its first write. Each lane keys its own
        # namespace (`PYLCM_CACHE_KEY`) so lanes never fight over one entry.
        uses: actions/cache@v6.1.0
        with:
          key: ${{env.PYLCM_CACHE_KEY}}-${{hashFiles('pixi.lock')}}-${{github.sha}}
          path: ~/.cache/jax
          restore-keys: |
            ${{env.PYLCM_CACHE_KEY}}-${{hashFiles('pixi.lock')}}-
            ${{env.PYLCM_CACHE_KEY}}-
      - name: Run one slow solution shard
        shell: bash {0}
        run: |
          set -euo pipefail
          mkdir -p reports
          pixi run -e tests-cpu python -m tests.ci.shard_test_files \
            tests/solution --shards "$PYLCM_CI_SHARDS" --shard "$PYLCM_CI_SHARD" \
            --weights-leg "fp$PYLCM_CI_PRECISION-solution" \
            > reports/solution-shard-files.txt
          mapfile -t files < reports/solution-shard-files.txt
          test "${#files[@]}" -gt 0
          coverage_args=()
          if test "$PYLCM_CI_PRECISION" = "64"; then
            coverage_args=(
              --cov=./
              --cov-report="xml:reports/coverage-solution-$PYLCM_CI_SHARD.xml"
            )
          fi
          pylcm_junit_report="reports/junit-$PYLCM_CI_PRECISION-$PYLCM_CI_SHARD.xml"
          pixi run -e tests-cpu pytest "${files[@]}" \
            --precision="$PYLCM_CI_PRECISION" -m slow \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            --timeout=600 --timeout-method=thread -v --max-worker-restart=0 \
            --durations=25 \
            --junitxml="$pylcm_junit_report" \
            -n 2 ${coverage_args[@]+"${coverage_args[@]}"}
      - name: Upload JUnit report and shard manifest
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: >-
            junit-cpu-fp${{ matrix.precision }}-solution-${{ matrix.shard }}
          path: |
            reports/junit-*.xml
            reports/solution-shard-files.txt
            reports/ci-receipts/*.json
          if-no-files-found: warn
      - name: Upload this lane's coverage data
        if: always() && matrix.precision == 64
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-solution-${{ matrix.shard }}
          path: reports/coverage-solution-${{ matrix.shard }}.xml
          if-no-files-found: error
      - name: Prune superseded JAX caches for this lane
        # `github.sha` in the key means every run writes a fresh entry instead
        # of replacing one, so an active branch accumulates them until the
        # repository passes GitHub's 10 GB ceiling. Keep this ref's newest entry
        # and drop the rest. Never fail the build over cache housekeeping: a
        # pull request from a fork gets a read-only token and cannot delete.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "$PYLCM_CACHE_KEY-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # The single deliberate combine stage. Every fp64 Linux lane uploads its own
  # complete coverage XML as an artifact and NONE of them talks to Codecov; this
  # job downloads them all, checks the set against the manifest's recorded
  # contributor list, and only then uploads. That replaces the old
  # "last invocation of the chain writes the XML" contract, which cannot survive
  # the split into independent jobs: `--cov-append` does not share data across
  # machines, and a partial upload would read as a coverage drop rather than as
  # a missing lane.
  coverage:
    name: Combine and publish coverage
    needs:
      - tests
      - tests-source-contract
      - tests-rest-slow
      - tests-certified
      - tests-timing
      - tests-topology-four-device
      - tests-topology-eight-device
      - tests-slow-solution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: true
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Download every lane's coverage data
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Check the complete contributor manifest
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e tests-cpu python -m tests.ci.check_coverage_manifest \
            coverage-data
      - name: Upload the combined coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: cpu-python
          directory: coverage-data
          disable_search: false
          fail_ci_if_error: true
  # One context for the whole matrix, so branch protection names `cpu` rather
  # than every lane -- adding a platform or a shard would otherwise silently
  # drop out of the required set until someone remembered to add it there too.
  # Fail-closed: every lane must have succeeded, and a skipped or cancelled lane
  # is not a success.
  cpu:
    name: cpu
    needs:
      - tests
      - tests-fp32
      - tests-source-contract
      - tests-rest-slow
      - tests-certified
      - tests-timing
      - tests-topology-four-device
      - tests-topology-eight-device
      - tests-exact-kernel
      - tests-slow-solution
      - coverage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fail unless every lane succeeded
        run: |-
          echo "tests: ${{needs.tests.result}}"
          echo "fp32: ${{needs.tests-fp32.result}}"
          echo "source-contract: ${{needs.tests-source-contract.result}}"
          echo "rest-slow: ${{needs.tests-rest-slow.result}}"
          echo "certified: ${{needs.tests-certified.result}}"
          echo "timing: ${{needs.tests-timing.result}}"
          echo "topology-four-device: ${{needs.tests-topology-four-device.result}}"
          echo "topology-eight-device: ${{needs.tests-topology-eight-device.result}}"
          echo "exact-kernel: ${{needs.tests-exact-kernel.result}}"
          echo "slow-solution: ${{needs.tests-slow-solution.result}}"
          echo "coverage: ${{needs.coverage.result}}"
          test "${{needs.tests.result}}" = "success"
          test "${{needs.tests-fp32.result}}" = "success"
          test "${{needs.tests-source-contract.result}}" = "success"
          test "${{needs.tests-rest-slow.result}}" = "success"
          test "${{needs.tests-certified.result}}" = "success"
          test "${{needs.tests-timing.result}}" = "success"
          test "${{needs.tests-topology-four-device.result}}" = "success"
          test "${{needs.tests-topology-eight-device.result}}" = "success"
          test "${{needs.tests-exact-kernel.result}}" = "success"
          test "${{needs.tests-slow-solution.result}}" = "success"
          test "${{needs.coverage.result}}" = "success"
