          fi
          pylcm_junit=reports/junit-cpu-fp$PYLCM_CI_PRECISION-simulation-eight-devices.xml
          JAX_NUM_CPU_DEVICES=8 JAX_PLATFORMS=cpu \
          XLA_FLAGS="${XLA_FLAGS:+$XLA_FLAGS }--xla_force_host_platform_device_count=8"\
            pixi run -e tests-cpu pytest \
