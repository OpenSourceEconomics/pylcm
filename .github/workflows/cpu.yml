          - os: ubuntu-latest
            precision: 64
          - os: windows-latest
            precision: 64
          - os: ubuntu-latest
            precision: 32
    env:
      PYLCM_CI_RECEIPT: reports/ci-receipts
      PYLCM_CI_PRECISION: ${{ matrix.precision }}
