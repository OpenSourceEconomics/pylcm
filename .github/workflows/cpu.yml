---
name: cpu
# Automatically cancel a previous run.
concurrency:
  group: cpu-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - benchmarks/**
      - '**.md'
      - '**.ipynb'
jobs:
  tests:
    name: Run tests for ${{ matrix.os }} on ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      # `contents` for the checkout, `actions` to delete this ref's superseded
      # JAX caches in the prune step below.
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.14'
        # Neither the macOS nor the Windows runner can host four parallel JAX AOT
        # compiles of the DC-EGM solve/oracle battery: macOS swap-thrashes for
        # hours, Windows grows past the 16 GB runner and is killed mid-suite.
        # Drop the `slow` set on both. What it covers is numerics, which are
        # platform-independent and stay covered on Linux and the two GPU jobs;
        # what these runners are here for is the platform surface — imports,
        # paths, dtypes, the pandas/arrow round trip — all of which is in the
        # remaining set.
        include:
          - os: macos-latest
            pytest_extra: -m "not slow"
          - os: windows-latest
            pytest_extra: -m "not slow"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Cache JAX compiled programs
        # `setup-pixi` caches the environment but not JAX's persistent
        # compilation cache, so every job recompiles every program from cold.
        # Safe because JAX keys an entry on the computation, the backend and its
        # own version, so a stale or torn entry misses rather than misleads —
        # `pixi.lock` in the key only saves the pointless misses after a JAX
        # upgrade. `github.sha` makes each run write a fresh entry while
        # `restore-keys` starts it from the nearest earlier one, so the cache
        # follows the branch instead of freezing at its first write.
        #
        # CPU only. The GPU jobs run on organization runners whose home
        # directory may already persist between runs, which would make this an
        # expensive no-op, and a shared cache directory is what a multi-worker
        # GPU run races on. Measure there before adding it.
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
              hashFiles('pixi.lock') }}-
            jax-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Run pytest
        shell: bash {0}
        run: pixi run -e tests-cpu tests ${{ matrix.pytest_extra }}
        if: runner.os != 'Linux' || matrix.python-version != '3.14'
      - name: Run pytest and collect coverage
        shell: bash {0}
        # A worker's resident memory grows with every distinct program it has
        # compiled, because JAX holds each one live in an in-memory cache, and
        # the DC-EGM solve/oracle battery (`slow`) compiles enough of them to
        # exhaust the 16 GB runner mid-suite. Two mechanisms keep it in budget:
        # - `--release-compiled-programs` drops that cache at every module
        #   boundary, which bounds the growth instead of merely dividing it.
        #   Measured on the `slow` battery at `-n 2`: peak resident memory over
        #   the process tree falls from 18.25 GB to 9.44 GB and stops ratcheting,
        #   and the phase runs faster rather than slower, because a released
        #   program is recompiled from the persistent on-disk cache.
        # - the phases stay separate, each starting from a fresh process, as a
        #   second line of defence and so coverage can be appended across them.
        #
        # `--timeout-method=thread` is not the default and the default cannot do
        # this job: `signal` delivers `SIGALRM` on schedule, but the handler runs
        # only at a bytecode boundary, so a test blocked inside one long call —
        # which is what an XLA compile is — reports its timeout when that call
        # returns and never bounds anything. Measured on a single LAPACK call
        # with a 20 s limit: `signal` reported at 91.8 s, `thread` at 20 s with
        # the frame. Under xdist the thread method takes the worker with it, so
        # the timing-out test is named, its siblings continue on a restarted
        # worker, and the run fails instead of being killed by the job ceiling
        # hours later with nothing to point at.
        run: |
          pixi run -e tests-cpu pytest tests -m "not slow" \
            --release-compiled-programs --timeout=1200 --timeout-method=thread \
            --cov=./ --cov-report= -n 4 \
          && pixi run -e tests-cpu pytest tests/solution -m slow \
            --release-compiled-programs --timeout=1200 --timeout-method=thread \
            --cov=./ --cov-append --cov-report= -n 2 \
          && pixi run -e tests-cpu pytest tests --ignore=tests/solution -m slow \
            --release-compiled-programs --timeout=1200 --timeout-method=thread \
            --cov=./ --cov-append --cov-report=xml -n 2
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Prune superseded JAX caches for this ref
        # `github.sha` in the key means every run writes a fresh entry instead of
        # replacing one, so an active branch accumulates them until the
        # repository passes GitHub's 10 GB ceiling. Eviction is then
        # least-recently-used, and the first casualty is the entry on the default
        # branch — the only one a *new* branch may restore from, since a run
        # reads its own ref and the default branch and nothing else. Every new
        # branch would then start cold and pay the full compile.
        #
        # Keep this ref's newest entry and drop the rest. Pruning here rather
        # than after the write leaves two per (os, ref) once the post-step saves
        # the new one, so a run cancelled before it saves still leaves the branch
        # a warm start. Never fail the build over cache housekeeping: a pull
        # request from a fork gets a read-only token and cannot delete.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref "$GITHUB_REF" \
            --key "jax-${{ runner.os }}-${{ matrix.python-version }}-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # fp32 is otherwise only exercised on `gpu32`, behind the contended GPU
  # runners. A dtype regression is not GPU-specific, so catch it here first,
  # on cheap and uncontended CPU capacity. Linux-only and its own job (not a
  # matrix leg) because the platform surface (imports, paths, the
  # pandas/arrow round trip) is already covered by `tests`, and adding fp32
  # x {macos, windows} would double CI time for a dimension that's about
  # dtype, not platform.
  tests-fp32:
    name: Run tests for ubuntu-latest on 3.14 (fp32)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Cache JAX compiled programs
        # Same rationale as the `tests` job's cache step above, keyed apart
        # (`jax-fp32-...`) so this leg never shares -- or fights over -- the
        # fp64 leg's cache entries.
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-fp32-${{ runner.os }}-3.14-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-fp32-${{ runner.os }}-3.14-${{
              hashFiles('pixi.lock') }}-
            jax-fp32-${{ runner.os }}-3.14-
      - name: Run pytest at fp32
        shell: bash {0}
        # Same memory budget as the fp64 leg above, for the same reason: a
        # worker's resident memory grows with every program it compiles, and the
        # `slow` battery compiles enough to exhaust the 16 GB runner. So this leg
        # runs the same phases with `--release-compiled-programs` rather than the
        # single `tests-32bit` invocation, which is the configuration that dies.
        # Precision does not change the compile load, so it does not change the
        # remedy.
        env:
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
        run: |
          pixi run -e tests-cpu pytest tests --precision=32 -m "not slow" \
            --release-compiled-programs --timeout=1200 --timeout-method=thread \
            -n 4 \
          && pixi run -e tests-cpu pytest tests/solution --precision=32 -m slow \
            --release-compiled-programs --timeout=1200 --timeout-method=thread \
            -n 2 \
          && pixi run -e tests-cpu pytest tests --ignore=tests/solution \
            --precision=32 -m slow --release-compiled-programs \
            --timeout=1200 --timeout-method=thread -n 2
      - name: Prune superseded JAX caches for this ref
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref "$GITHUB_REF" \
            --key "jax-fp32-${{ runner.os }}-3.14-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # One context for the whole matrix, so branch protection names `cpu` rather than
  # every (os, python-version) leg — adding a platform would otherwise silently drop
  # out of the required set until someone remembered to add it there too.
  cpu:
    name: cpu
    needs:
      - tests
      - tests-fp32
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every leg succeeded
        run: |-
          echo "tests: ${{ needs.tests.result }}"
          echo "tests-fp32: ${{ needs.tests-fp32.result }}"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.tests-fp32.result }}" = "success"
