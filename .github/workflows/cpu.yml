---
name: cpu
# Automatically cancel a previous run.
concurrency:
  group: cpu-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - benchmarks/**
      - '**.md'
      - '**.ipynb'
jobs:
  tests:
    name: Run tests for ${{ matrix.os }} on ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      # `contents` for the checkout, `actions` to delete this ref's superseded
      # JAX caches in the prune step below.
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Cache JAX compiled programs
        # `setup-pixi` caches the environment but not JAX's persistent
        # compilation cache, so every job recompiles every program from cold.
        # Safe because JAX keys an entry on the computation, the backend and its
        # own version, so a stale or torn entry misses rather than misleads —
        # `pixi.lock` in the key only saves the pointless misses after a JAX
        # upgrade. `github.sha` makes each run write a fresh entry while
        # `restore-keys` starts it from the nearest earlier one, so the cache
        # follows the branch instead of freezing at its first write.
        #
        # CPU only. The GPU jobs run on organization runners whose home
        # directory may already persist between runs, which would make this an
        # expensive no-op, and a shared cache directory is what a multi-worker
        # GPU run races on. Measure there before adding it.
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
              hashFiles('pixi.lock') }}-
            jax-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Run pytest
        shell: bash {0}
        run: pixi run -e tests-cpu tests
        if: runner.os != 'Linux' || matrix.python-version != '3.14'
      - name: Run pytest and collect coverage
        shell: bash {0}
        run: pixi run -e tests-cpu tests-with-cov
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Prune superseded JAX caches for this ref
        # `github.sha` in the key means every run writes a fresh entry instead of
        # replacing one, so an active branch accumulates them until the
        # repository passes GitHub's 10 GB ceiling. Eviction is then
        # least-recently-used, and the first casualty is the entry on the default
        # branch — the only one a *new* branch may restore from, since a run
        # reads its own ref and the default branch and nothing else. Every new
        # branch would then start cold and pay the full compile.
        #
        # Keep this ref's newest entry and drop the rest. Pruning here rather
        # than after the write leaves two per (os, ref) once the post-step saves
        # the new one, so a run cancelled before it saves still leaves the branch
        # a warm start. Never fail the build over cache housekeeping: a pull
        # request from a fork gets a read-only token and cannot delete.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref "$GITHUB_REF" \
            --key "jax-${{ runner.os }}-${{ matrix.python-version }}-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # One context for the whole matrix, so branch protection names `cpu` rather than
  # every (os, python-version) leg — adding a platform would otherwise silently drop
  # out of the required set until someone remembered to add it there too.
  cpu:
    name: cpu
    needs:
      - tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix leg succeeded
        run: |-
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"
