            ${{env.PYLCM_CACHE_KEY}}-${{hashFiles('pixi.lock')}}-
            ${{env.PYLCM_CACHE_KEY}}-
      - name: Run the serial timing witnesses
        shell: bash {0}
        run: |
          set -euo pipefail
