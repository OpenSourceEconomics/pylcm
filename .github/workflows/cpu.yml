      - name: Prune superseded JAX caches for this lane
        # `github.sha` in the key means every run writes a fresh entry instead
        # of replacing one, so an active branch accumulates them until the
        # repository passes GitHub's 10 GB ceiling. Keep this ref's newest entry
        # and drop the rest. Never fail the build over cache housekeeping: a
        # pull request from a fork gets a read-only token and cannot delete.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "$PYLCM_CACHE_KEY-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # These modules receive eight devices from the process ENVIRONMENT and never
  # mutate import-time topology, so all three topology controls must be set
  # before pytest starts -- ahead of policy and backend initialization. They can
  # therefore activate the full policy. Their guards refuse even partial native
  # skips: an all-skipped or any-skipped report fails the step.
  tests-topology-eight-device:
    name: Run the eight-CPU-device witnesses (Linux, fp${{ matrix.precision }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        precision:
          - 64
          - 32
    env:
      PYLCM_CI_RECEIPT: reports/ci-receipts
      PYLCM_CI_PRECISION: ${{ matrix.precision }}
      PYLCM_CACHE_KEY: jax-eight-device-fp${{ matrix.precision }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          pylcm_native_report="reports/native.json"
          set +e
          pixi run -e tests-cpu python -m tests.ci.probe_native \
            --report="$pylcm_native_report"
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cpu --locked pylcm
            pixi run -e tests-cpu python -m tests.ci.probe_native \
              --report="$pylcm_native_report"
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Cache JAX compiled programs
        # `setup-pixi` caches the environment but not JAX's persistent
        # compilation cache, so every job recompiles every program from cold.
        # Safe because JAX keys an entry on the computation, the backend and its
        # own version, so a stale or torn entry misses rather than misleads.
        # `github.sha` makes each run write a fresh entry while `restore-keys`
        # starts it from the nearest earlier one, so the cache follows the
        # branch instead of freezing at its first write. Each lane keys its own
        # namespace (`PYLCM_CACHE_KEY`) so lanes never fight over one entry.
        uses: actions/cache@v6.1.0
        with:
          key: ${{env.PYLCM_CACHE_KEY}}-${{hashFiles('pixi.lock')}}-${{github.sha}}
          path: ~/.cache/jax
          restore-keys: |
            ${{env.PYLCM_CACHE_KEY}}-${{hashFiles('pixi.lock')}}-
            ${{env.PYLCM_CACHE_KEY}}-
      - name: Run tests/test_distributed_simulation_eight_devices.py
