---
name: cpu
# Automatically cancel a previous run.
concurrency:
  group: cpu-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - benchmarks/**
      - '**.md'
      - '**.ipynb'
jobs:
  tests:
    name: Run tests for ${{ matrix.os }} on ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      # `contents` for the checkout, `actions` to delete this ref's superseded
      # JAX caches in the prune step below.
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.14'
        # Neither the macOS nor the Windows runner can host four parallel JAX AOT
        # compiles of the DC-EGM solve/oracle battery: macOS swap-thrashes for
        # hours, Windows grows past the 16 GB runner and is killed mid-suite.
        # Drop the `slow` set on both. What it covers is numerics, which are
        # platform-independent and stay covered on Linux and the two GPU jobs;
        # what these runners are here for is the platform surface — imports,
        # paths, dtypes, the pandas/arrow round trip — all of which is in the
        # remaining set.
        include:
          - os: macos-latest
            pytest_extra: -m "not slow"
          - os: windows-latest
            pytest_extra: -m "not slow"
    steps:
      - uses: actions/checkout@v7
      - name: Activate the MSVC developer environment
        # Must precede `setup-pixi`. Installing the project editable runs the
        # hatch build hook, which compiles the kernel and fails when no C++
        # compiler is on PATH -- on every platform, not only this one. Putting
        # the activation after the install leaves `cl.exe` absent for the one
        # step that needs it, so the environment never finishes building.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          set +e
          pixi run -e tests-cpu python -m tests.ci.probe_native \
            --report=reports/native-${{ runner.os }}-fp64.json
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cpu --locked pylcm
            pixi run -e tests-cpu python -m tests.ci.probe_native \
              --report=reports/native-${{ runner.os }}-fp64.json
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Cache JAX compiled programs
        # `setup-pixi` caches the environment but not JAX's persistent
        # compilation cache, so every job recompiles every program from cold.
        # Safe because JAX keys an entry on the computation, the backend and its
        # own version, so a stale or torn entry misses rather than misleads —
        # `pixi.lock` in the key only saves the pointless misses after a JAX
        # upgrade. `github.sha` makes each run write a fresh entry while
        # `restore-keys` starts it from the nearest earlier one, so the cache
        # follows the branch instead of freezing at its first write.
        #
        # CPU only. The GPU jobs run on organization runners whose home
        # directory may already persist between runs, which would make this an
        # expensive no-op, and a shared cache directory is what a multi-worker
        # GPU run races on. Measure there before adding it.
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
              hashFiles('pixi.lock') }}-
            jax-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Run the fp64 exact-kernel capability matrix
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        shell: bash {0}
        run: >-
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py
          --precision=64 --output-dir=reports
      - name: Run the Windows exact-kernel capability matrix
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        # Both precisions run even when the first fails, because each arm's
        # report is evidence about a different build; the step then fails if
        # either did. A bare `bash {0}` template has neither `-e` nor a status
        # of its own beyond the last command's, so without the explicit exit a
        # failing fp32 arm is reported as success whenever fp64 passes.
        shell: bash {0}
        run: |
          rc=0
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py \
            --precision=32 --output-dir=reports || rc=1
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py \
            --precision=64 --output-dir=reports || rc=1
          exit "$rc"
      - name: Run pytest
        shell: bash {0}
        run: >-
          mkdir -p reports &&
          pixi run -e tests-cpu tests ${{ matrix.pytest_extra }}
          --policy-child --ci-policy=full --hardware-profile=cpu
          --junitxml=reports/junit-cpu-${{ runner.os }}.xml
        if: runner.os != 'Linux' || matrix.python-version != '3.14'
      - name: Run pytest and collect coverage
        shell: bash {0}
        # The long `tests/solution -m slow` battery runs in the sharded matrix
        # below. This base leg keeps the fast suite, slow non-solution tests, and
        # the two certified-envelope cases. Certified runs in its own process
        # because it alone requires the disabled XLA backend optimizer; applying
        # that flag to the rest would invalidate batch-width invariance checks.
        # Coverage from this base leg and the fp64 shards is merged by Codecov.
        run: |
          mkdir -p reports
          pixi run -e tests-cpu pytest tests -m "not slow" \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            --timeout=600 --timeout-method=thread -v --max-worker-restart=3 \
            --durations=25 --junitxml=reports/junit-cpu-fp64-notslow.xml \
            --cov=./ --cov-report= -n 4 \
          && XLA_FLAGS=--xla_backend_optimization_level=0 \
            pixi run -e tests-cpu pytest \
            tests/solution/test_nbegm_multi_discrete_agreement.py \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            -m slow -k certified \
            --timeout=2400 --timeout-method=thread \
            --durations=25 --junitxml=reports/junit-cpu-fp64-certified.xml \
            --cov=./ --cov-append --cov-report= -n 0 \
          && pixi run -e tests-cpu pytest tests --ignore=tests/solution -m slow \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            --timeout=600 --timeout-method=thread -v --max-worker-restart=3 \
            --durations=25 --junitxml=reports/junit-cpu-fp64-rest-slow.xml \
            --cov=./ --cov-append --cov-report=xml -n 2
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
      - name: Upload JUnit reports
        # `always()` so a failing run still publishes its report: the XML is how
        # a run's counts are read back, and a run that failed is exactly when
        # that matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-cpu-fp64-${{ runner.os }}-${{ matrix.python-version }}
          path: reports/junit-cpu-*.xml
          if-no-files-found: warn
      - name: Upload exact-kernel capability diagnostics
        # Kept out of the JUnit artifact above on purpose. The matrix's `broken`
        # arm is required to produce a failing testcase -- that failure is the
        # positive control proving the detector fires -- so pooling its report
        # with the suite's would put a failure and three extra arms per
        # precision into the counts a healthy run reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-kernel-matrix-fp64-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            reports/junit-exact-kernel-matrix-*.xml
            reports/exact-kernel-skips-*.json
            reports/exact-kernel-matrix-*.log
          if-no-files-found: warn
      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Prune superseded JAX caches for this ref
        # `github.sha` in the key means every run writes a fresh entry instead of
        # replacing one, so an active branch accumulates them until the
        # repository passes GitHub's 10 GB ceiling. Eviction is then
        # least-recently-used, and the first casualty is the entry on the default
        # branch — the only one a *new* branch may restore from, since a run
        # reads its own ref and the default branch and nothing else. Every new
        # branch would then start cold and pay the full compile.
        #
        # Keep this ref's newest entry and drop the rest. Pruning here rather
        # than after the write leaves two per (os, ref) once the post-step saves
        # the new one, so a run cancelled before it saves still leaves the branch
        # a warm start. Never fail the build over cache housekeeping: a pull
        # request from a fork gets a read-only token and cannot delete.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref "$GITHUB_REF" \
            --key "jax-${{ runner.os }}-${{ matrix.python-version }}-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # fp32 is otherwise only exercised on `gpu32`, behind the contended GPU
  # runners. A dtype regression is not GPU-specific, so catch it here first,
  # on cheap and uncontended CPU capacity. Linux-only and its own job (not a
  # matrix leg) because the platform surface (imports, paths, the
  # pandas/arrow round trip) is already covered by `tests`, and adding fp32
  # x {macos, windows} would double CI time for a dimension that's about
  # dtype, not platform.
  tests-fp32:
    name: Run tests for ubuntu-latest on 3.14 (fp32)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Activate the MSVC developer environment
        # Must precede `setup-pixi`. Installing the project editable runs the
        # hatch build hook, which compiles the kernel and fails when no C++
        # compiler is on PATH -- on every platform, not only this one. Putting
        # the activation after the install leaves `cl.exe` absent for the one
        # step that needs it, so the environment never finishes building.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          set +e
          pixi run -e tests-cpu python -m tests.ci.probe_native \
            --report=reports/native-Linux-fp32.json
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cpu --locked pylcm
            pixi run -e tests-cpu python -m tests.ci.probe_native \
              --report=reports/native-Linux-fp32.json
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Cache JAX compiled programs
        # Same rationale as the `tests` job's cache step above, keyed apart
        # (`jax-fp32-...`) so this leg never shares -- or fights over -- the
        # fp64 leg's cache entries.
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-fp32-${{ runner.os }}-3.14-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-fp32-${{ runner.os }}-3.14-${{
              hashFiles('pixi.lock') }}-
            jax-fp32-${{ runner.os }}-3.14-
      - name: Run the fp32 exact-kernel capability matrix
        shell: bash {0}
        run: >-
          pixi run -e tests-cpu python tests/ci/run_exact_kernel_matrix.py
          --precision=32 --output-dir=reports
      - name: Run pytest at fp32
        shell: bash {0}
        # The long slow solution battery runs in the shared precision/shard
        # matrix below. This leg retains the fast and slow non-solution tests.
        env:
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
        run: |
          mkdir -p reports
          pixi run -e tests-cpu pytest tests --precision=32 -m "not slow" \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            --timeout=600 --timeout-method=thread -v --max-worker-restart=3 \
            --durations=25 --junitxml=reports/junit-cpu-fp32-notslow.xml \
            -n 4 \
          && pixi run -e tests-cpu pytest tests --ignore=tests/solution \
            --precision=32 -m slow \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            --timeout=600 --timeout-method=thread -v --max-worker-restart=3 \
            --durations=25 --junitxml=reports/junit-cpu-fp32-rest-slow.xml -n 2
      - name: Upload JUnit reports
        # `always()` so a failing run still publishes its report: the XML is how
        # a run's counts are read back, and a run that failed is exactly when
        # that matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-cpu-fp32
          path: reports/junit-cpu-*.xml
          if-no-files-found: warn
      - name: Upload exact-kernel capability diagnostics
        # Separate from the JUnit artifact for the same reason as the fp64 leg:
        # the `broken` arm's required failure must not land in the counts a
        # healthy run reports.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-kernel-matrix-fp32
          path: |
            reports/junit-exact-kernel-matrix-*.xml
            reports/exact-kernel-skips-*.json
            reports/exact-kernel-matrix-*.log
          if-no-files-found: warn
      - name: Prune superseded JAX caches for this ref
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref "$GITHUB_REF" \
            --key "jax-fp32-${{ runner.os }}-3.14-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # The slow solution phase dominates both CPU precisions. Stable hashing assigns
  # whole files to three jobs, preserving module-local compile reuse while new or
  # renamed files enter exactly one shard without maintaining a timing manifest.
  # Each job keeps two xdist workers: increasing that inside a 16 GB runner has
  # exhausted memory, whereas separate runners provide real parallel capacity.
  tests-slow-solution:
    name: >-
      Run slow solution tests on ubuntu-latest at fp${{ matrix.precision }}
      (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        precision:
          - 64
          - 32
        shard:
          - 1
          - 2
          - 3
    env:
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      PYLCM_CI_PRECISION: ${{ matrix.precision }}
      PYLCM_CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          pylcm_native_report="reports/native-$PYLCM_CI_PRECISION-$PYLCM_CI_SHARD.json"
          set +e
          pixi run -e tests-cpu python -m tests.ci.probe_native \
            --report="$pylcm_native_report"
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cpu --locked pylcm
            pixi run -e tests-cpu python -m tests.ci.probe_native \
              --report="$pylcm_native_report"
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Cache this shard's JAX compiled programs
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-solution-fp${{ matrix.precision }}-shard${{ matrix.shard }}-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-solution-fp${{ matrix.precision }}-shard${{ matrix.shard }}-${{
              hashFiles('pixi.lock') }}-
            jax-solution-fp${{ matrix.precision }}-shard${{ matrix.shard }}-
      - name: Run one slow solution shard
        shell: bash {0}
        run: |
          set -euo pipefail
          mkdir -p reports
          pixi run -e tests-cpu python -m tests.ci.shard_test_files \
            tests/solution --shards 3 --shard "$PYLCM_CI_SHARD" \
            > reports/solution-shard-files.txt
          mapfile -t files < reports/solution-shard-files.txt
          test "${#files[@]}" -gt 0
          coverage_args=()
          if test "$PYLCM_CI_PRECISION" = "64"; then
            pylcm_coverage_report="reports/coverage-64-$PYLCM_CI_SHARD.xml"
            coverage_args=(
              --cov=./
              --cov-report="xml:$pylcm_coverage_report"
            )
          fi
          pylcm_junit_report="reports/junit-$PYLCM_CI_PRECISION-$PYLCM_CI_SHARD.xml"
          pixi run -e tests-cpu pytest "${files[@]}" \
            --precision="$PYLCM_CI_PRECISION" -m slow \
            --policy-child --ci-policy=full --hardware-profile=cpu \
            --timeout=600 --timeout-method=thread -v --max-worker-restart=3 \
            --durations=25 \
            --junitxml="$pylcm_junit_report" \
            -n 2 "${coverage_args[@]}"
      - name: Upload JUnit report and shard manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            junit-cpu-fp${{ matrix.precision }}-solution-${{ matrix.shard }}
          path: |
            reports/junit-*.xml
            reports/solution-shard-files.txt
          if-no-files-found: warn
      - name: Upload coverage report
        if: matrix.precision == 64
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            reports/coverage-64-${{ matrix.shard }}.xml
          disable_search: true
          fail_ci_if_error: true
      - name: Prune superseded JAX caches for this shard
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --ref "$GITHUB_REF" \
            --key "jax-solution-fp${{ matrix.precision }}-shard${{ matrix.shard }}-" \
            --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' | while read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" || true
            done
  # One context for the whole matrix, so branch protection names `cpu` rather than
  # every (os, python-version) leg — adding a platform would otherwise silently drop
  # out of the required set until someone remembered to add it there too.
  cpu:
    name: cpu
    needs:
      - tests
      - tests-fp32
      - tests-slow-solution
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every leg succeeded
        run: |-
          echo "tests: ${{ needs.tests.result }}"
          echo "tests-fp32: ${{ needs.tests-fp32.result }}"
          echo "tests-slow-solution: ${{ needs.tests-slow-solution.result }}"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.tests-fp32.result }}" = "success"
          test "${{ needs.tests-slow-solution.result }}" = "success"
