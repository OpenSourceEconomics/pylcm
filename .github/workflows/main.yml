---
name: main
# Automatically cancel a previous run.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - benchmarks/**
      - '**.md'
      - '**.ipynb'
jobs:
  run-tests:
    name: Run tests for ${{ matrix.os }} on ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.14'
        # Neither the macOS nor the Windows runner can host four parallel JAX AOT
        # compiles of the DC-EGM solve/oracle battery: macOS swap-thrashes for
        # hours, Windows grows past the 16 GB runner and is killed mid-suite.
        # Drop the `slow` set on both. What it covers is numerics, which are
        # platform-independent and stay covered on Linux and the two GPU jobs;
        # what these runners are here for is the platform surface — imports,
        # paths, dtypes, the pandas/arrow round trip — all of which is in the
        # remaining set.
        include:
          - os: macos-latest
            pytest_extra: -m "not slow"
          - os: windows-latest
            pytest_extra: -m "not slow"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cpu
          activate-environment: true
          frozen: true
      - name: Cache JAX compiled programs
        # `setup-pixi` caches the environment but not JAX's persistent
        # compilation cache, so every job recompiles the whole model from cold.
        # Measured on a full DC-EGM suite: 98 s cold against 21 s warm. Safe
        # because JAX keys an entry on the computation, the backend and its own
        # version, so a stale or torn entry misses rather than misleads —
        # `pixi.lock` in the key only saves the pointless misses after a JAX
        # upgrade. `github.sha` makes every run write a fresh entry while
        # `restore-keys` starts it from the nearest earlier one, so the cache
        # follows the branch instead of freezing at its first write.
        #
        # The GPU jobs are deliberately left out: they run on organization
        # runners whose home directory may already persist between runs, which
        # would make this an expensive no-op. Measure there before adding it.
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: >-
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{
              hashFiles('pixi.lock') }}-
            jax-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Run pytest
        shell: bash {0}
        run: pixi run -e tests-cpu tests ${{ matrix.pytest_extra }}
        if: runner.os != 'Linux' || matrix.python-version != '3.14'
      - name: Run pytest and collect coverage
        shell: bash {0}
        # A worker's resident memory grows with every distinct program it has
        # compiled, because JAX holds each one live in an in-memory cache, and
        # the DC-EGM solve/oracle battery (`slow`) compiles enough of them to
        # exhaust the 16 GB runner mid-suite. Two mechanisms keep it in budget:
        # - `--release-compiled-programs` drops that cache at every module
        #   boundary, which bounds the growth instead of merely dividing it.
        #   Measured on the `slow` battery at `-n 2`: peak resident memory over
        #   the process tree falls from 18.25 GB to 9.44 GB and stops ratcheting,
        #   and the phase runs faster rather than slower, because a released
        #   program is recompiled from the persistent on-disk cache.
        # - the phases stay separate, each starting from a fresh process, as a
        #   second line of defence and so coverage can be appended across them.
        run: |
          pixi run -e tests-cpu pytest tests -m "not slow" \
            --release-compiled-programs --cov=./ --cov-report= -n 4 \
          && pixi run -e tests-cpu pytest tests/solution -m slow \
            --release-compiled-programs --cov=./ --cov-append --cov-report= -n 2 \
          && pixi run -e tests-cpu pytest tests --ignore=tests/solution -m slow \
            --release-compiled-programs --cov=./ --cov-append --cov-report=xml -n 2
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
  run-ty:
    name: Run ty
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: type-checking
          frozen: true
      - name: Run ty
        shell: bash {0}
        # The prek `ty` hook is skipped on pre-commit.ci (no pixi envs there);
        # this job runs it against the `type-checking` env instead.
        run: pixi run -e type-checking prek run ty --all-files
  run-tests-gpu:
    name: Run tests on GPU
    # Config:
    # https://github.com/organizations/OpenSourceEconomics/settings/actions/runners
    # Docs on GPU runners:
    # https://docs.github.com/en/actions/using-github-hosted-runners/using-larger-runners
    runs-on: ubuntu-latest-gpu
    steps:
      - name: Check CUDA version
        run: |
          nvidia-smi
          nvcc --version || echo "nvcc not found"
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cuda12
          frozen: false
      - name: Run pytest on GPU
        shell: bash {0}
        # Invoking `pytest` directly rather than the pixi task drops the task's
        # `env`, so the preallocation setting is restored here. Without it JAX
        # claims most of the device up front and the Mahler & Yum solve has
        # nothing left to grow into.
        env:
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
        # Run serially (-n0 overrides the task's -n 4): the single GPU runner is
        # starved of host CPU/memory by parallel JAX AOT compiles. CPU jobs keep -n 4.
        #
        # The GPU-scale Mahler & Yum module runs first, in its own process: its
        # solve kernels only fit the device when XLA fully fuses the
        # max-over-actions reduction, and compiling them late in a long-lived
        # process that has run the whole DC-EGM battery has produced an
        # unfused executable whose scratch arena (half the state-action product)
        # exceeds device memory. A fresh process pins the fused compile.
        run: |
          pixi run -e tests-cuda12 pytest tests/test_mahler_yum_2024.py -n0 \
          && pixi run -e tests-cuda12 pytest tests -n0 \
            --ignore=tests/test_mahler_yum_2024.py
  run-tests-gpu-32bit:
    name: Run tests on GPU (32-bit precision)
    runs-on: ubuntu-latest-gpu
    steps:
      - name: Check CUDA version
        run: |
          nvidia-smi
          nvcc --version || echo "nvcc not found"
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cuda12
          frozen: false
      - name: Run pytest on GPU with 32-bit precision
        shell: bash {0}
        # Invoking `pytest` directly rather than the pixi task drops the task's
        # `env`, so the preallocation setting is restored here.
        env:
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
        # Run serially (-n0 overrides the task's -n 4): the single GPU runner is
        # starved of host CPU/memory by parallel JAX AOT compiles. CPU jobs keep -n 4.
        #
        # Mahler & Yum runs first in its own process, for the reason given on the
        # 64-bit job. Keeping it in the same process as the rest of the suite has
        # exhausted host memory late in the run, and the OOM takes the runner
        # agent with it — the job then reports "the hosted runner lost
        # communication with the server" and uploads no log to explain itself.
        run: |
          pixi run -e tests-cuda12 pytest tests/test_mahler_yum_2024.py \
            --precision=32 -n0 \
          && pixi run -e tests-cuda12 pytest tests --precision=32 -n0 \
            --ignore=tests/test_mahler_yum_2024.py
  run-explanation-notebooks:
    name: Run explanation notebooks on Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.75.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: docs
          frozen: false
      - name: Run explanation notebooks
        shell: bash {0}
        run: pixi run -e docs explanation-notebooks
