---
name: gpu
concurrency:
  group: gpu-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - benchmarks/**
      - '**.md'
      - '**.ipynb'
jobs:
  tests:
    name: Run bounded GPU policy
    runs-on: ubuntu-latest-gpu
    timeout-minutes: 90
    # The `test` task runs its policy children one after another, each with `-n0`
    # (tests/ci/policy_launcher.py), so one pytest process holds the GPU at a time
    # and it reserves 0.75 / 1 worker of the device up front. The default
    # device-memory budget is derived from that preallocated pool.
    env:
      XLA_PYTHON_CLIENT_PREALLOCATE: 'true'
      XLA_PYTHON_CLIENT_MEM_FRACTION: '0.75'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select the runner's actual CUDA architecture
        shell: bash
        run: |
          capability=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader \
            | head -n 1 | tr -d '.')
          test -n "$capability"
          echo "NVCCFLAGS=-arch=sm_${capability}" >> "$GITHUB_ENV"
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cuda12
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          set +e
          pixi run -e tests-cuda12 python -m tests.ci.probe_native \
            --report=reports/native-gpu.json
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cuda12 --locked pylcm
            pixi run -e tests-cuda12 python -m tests.ci.probe_native \
              --report=reports/native-gpu.json
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Restore JAX compilation cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/jax
          key: jax-gpu-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-gpu-${{ hashFiles('pixi.lock') }}-
            jax-gpu-
      - name: Run the bounded GPU policy
        shell: bash
        run: >-
          pixi run -e tests-cuda12 test --
          --ci-policy=pr --hardware-profile=gpu-small --precision=auto
          --environment=tests-cuda12 --report-dir=reports/policy
          --log-cli-level=INFO tests
      - name: Diagnose public replay with cache disabled from process startup
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JAX_ENABLE_COMPILATION_CACHE: 'false'
          PUBLIC_REPLAY_TESTS: >-
            (public_solve_captures_adjacent_periods and False) or
            public_interrupted_capture or public_period_refuses_unsupported_cache_mode
        run: |
          pixi run -e tests-cuda12 python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import jax
          root = Path(jax.__file__).parent
          names = ("compilation_cache.py", "compiler.py", "config.py", "cache_key.py")
          record = {
              "jax_version": jax.__version__,
              "cache_enabled_at_startup": jax.config.jax_enable_compilation_cache,
              "source_sha256": {
                  name: hashlib.sha256((root / "_src" / name).read_bytes()).hexdigest()
                  for name in names
              },
          }
          Path("reports/public-replay-jax-source.json").write_text(json.dumps(record))
          assert record["cache_enabled_at_startup"] is False
          PY
          pixi run -e tests-cuda12 test -- \
            --ci-policy=pr --hardware-profile=gpu-small --precision=auto \
            --environment=tests-cuda12 --report-dir=reports/public-replay-no-cache \
            -k "$PUBLIC_REPLAY_TESTS" \
            tests/solution/test_period_replay.py
      - name: Upload policy and native reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gpu-reports
          path: reports/
          if-no-files-found: warn
  gpu32:
    name: gpu32
    needs:
      - tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        if: contains(needs.*.result, 'cancelled')
        with:
          sparse-checkout: .github/actions
      - id: superseded
        if: contains(needs.*.result, 'cancelled')
        uses: ./.github/actions/superseded
      - name: Fail unless the bounded GPU policy succeeded
        if: >-
          steps.superseded.outputs.superseded != 'true'
          || contains(needs.*.result, 'failure')
        run: test "${{ needs.tests.result }}" = "success"
  gpu64:
    name: gpu64
    needs:
      - tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        if: contains(needs.*.result, 'cancelled')
        with:
          sparse-checkout: .github/actions
      - id: superseded
        if: contains(needs.*.result, 'cancelled')
        uses: ./.github/actions/superseded
      - name: Fail unless the bounded GPU policy succeeded
        if: >-
          steps.superseded.outputs.superseded != 'true'
          || contains(needs.*.result, 'failure')
        run: test "${{ needs.tests.result }}" = "success"
