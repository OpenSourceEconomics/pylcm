---
name: gpu32
# Automatically cancel a previous run.
concurrency:
  group: gpu32-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - docs/**
      - benchmarks/**
      - '**.md'
      - '**.ipynb'
jobs:
  run:
    name: Run fp32 GPU tests for ubuntu-latest-gpu on 3.14
    # Config:
    # https://github.com/organizations/OpenSourceEconomics/settings/actions/runners
    # Docs on GPU runners:
    # https://docs.github.com/en/actions/using-github-hosted-runners/using-larger-runners
    runs-on: ubuntu-latest-gpu
    steps:
      - name: Check CUDA version
        run: |
          nvidia-smi
          nvcc --version || echo "nvcc not found"
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cuda12
          frozen: false
      - name: Run pytest on GPU with 32-bit precision
        shell: bash {0}
        run: pixi run -e tests-cuda12 tests-32bit
  # A required status check matches by exact check-run name, and `name:` above
  # overrides what gets reported -- so branch protection's context `gpu32`
  # never matched `Run fp32 GPU tests for ubuntu-latest-gpu on 3.14` and sat
  # "Expected -- Waiting for status to be reported" forever, even after `run`
  # passed. Mirrors `cpu`'s gate job in cpu.yml, which is why that one already
  # worked.
  gpu32:
    name: gpu32
    needs:
      - run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the check succeeded
        run: |-
          echo "run: ${{ needs.run.result }}"
          test "${{ needs.run.result }}" = "success"
