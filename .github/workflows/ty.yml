---
name: ty
# No path filter. `[tool.ty] src.include` covers `docs/`, and most functions in the
# notebooks carry annotations — they are the snippets users copy, so a wrong one
# there propagates. Excluding `**.ipynb` would skip the check on exactly the change
# that can break it.
# Automatically cancel a previous run.
concurrency:
  group: ty-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
jobs:
  ty:
    # Named for the workflow, not for what it runs on: this is the context branch
    # protection requires, so a Python-version bump must not rename it and drop it
    # out of the required set.
    name: ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: type-checking
          frozen: true
      - name: Run ty
        shell: bash {0}
        # The prek `ty` hook is skipped on pre-commit.ci (no pixi envs there);
        # this job runs it against the `type-checking` env instead.
        run: pixi run -e type-checking prek run ty --all-files
