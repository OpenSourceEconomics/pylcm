---
name: ty
# No path filter. `[tool.ty] src.include` covers `docs/`, and most functions in the
# notebooks carry annotations — they are the snippets users copy, so a wrong one
# there propagates. Excluding `**.ipynb` would skip the check on exactly the change
# that can break it.
# Automatically cancel a previous run.
concurrency:
  group: ty-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
jobs:
  run:
    name: Run ty on the codebase on 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: type-checking
          frozen: true
      - name: Run ty
        shell: bash {0}
        # The prek `ty` hook is skipped on pre-commit.ci (no pixi envs there);
        # this job runs it against the `type-checking` env instead.
        run: pixi run -e type-checking prek run ty --all-files
  # A required status check matches by exact check-run name, and `name:` above
  # overrides what gets reported -- so branch protection's context `ty` never
  # matched `Run ty on the codebase on 3.14` and sat "Expected -- Waiting for
  # status to be reported" forever, even after `run` passed. Mirrors `cpu`'s
  # gate job in cpu.yml, which is why that one already worked.
  ty:
    name: ty
    needs:
      - run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the check succeeded
        run: |-
          echo "run: ${{ needs.run.result }}"
          test "${{ needs.run.result }}" = "success"
