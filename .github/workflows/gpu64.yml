---
name: gpu64
concurrency:
  group: gpu64-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  workflow_dispatch: null
jobs:
  tests:
    name: Run fp64 GPU policy
    runs-on: ubuntu-latest-gpu
    timeout-minutes: 90
    env:
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Select the runner's actual CUDA architecture
        shell: bash
        run: |
          capability=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader \
            | head -n 1 | tr -d '.')
          test -n "$capability"
          echo "NVCCFLAGS=-arch=sm_${capability}" >> "$GITHUB_ENV"
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: tests-cuda12
          frozen: true
      - name: Probe or reinstall the installed native payload
        shell: bash
        run: |
          mkdir -p reports
          set +e
          pixi run -e tests-cuda12 python -m tests.ci.probe_native \
            --report=reports/native-fp64.json
          status=$?
          set -e
          if test "$status" -eq 2; then
            pixi reinstall -e tests-cuda12 --locked pylcm
            pixi run -e tests-cuda12 python -m tests.ci.probe_native \
              --report=reports/native-fp64.json
          elif test "$status" -ne 0; then
            exit "$status"
          fi
      - name: Restore JAX compilation cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/jax
          key: jax-gpu64-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-gpu64-${{ hashFiles('pixi.lock') }}-
            jax-gpu64-
      - name: Run the bounded fp64 GPU policy
        shell: bash
        run: >-
          pixi run -e tests-cuda12 test --
          --ci-policy=pr --hardware-profile=gpu-small --precision=64
          --environment=tests-cuda12 --report-dir=reports/policy-fp64 tests
      - name: Upload policy and native reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu64-reports
          path: reports/
          if-no-files-found: warn
  gpu64:
    name: gpu64
    needs:
      - tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the fp64 policy succeeded
        run: test "${{ needs.tests.result }}" = "success"
