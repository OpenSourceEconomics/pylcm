---
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.28.2
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=10000
      - id: check-ast
        language_version: python3.14
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: debug-statements
        language_version: python3.14
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
        types:
          - text
      - id: mixed-line-ending
        args:
          - --fix=lf
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: name-tests-test
        args:
          - --pytest-test-first
        exclude: tests/mock_regime.py|tests/collective_fixtures.py|tests/envelope_configs.py|^tests/test_models/|^tests/data/|^tests/solution/_|^tests/ci/|^tests/candidate_certificate/
      - id: no-commit-to-branch
        args:
          - --branch
          - main
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args:
          - --fix
        types_or:
          - jupyter
          - pyi
          - python
      - id: ruff-format
        types_or:
          - jupyter
          - pyi
          - python
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.75
    hooks:
      - id: ty
        # `--no-project` keeps uv from creating a `.venv`/`uv.lock` in this
        # pixi-managed repo; ty resolves third-party imports from the env named
        # in `[tool.ty] environment.python` (run `pixi install` once).
        args:
          - --no-project
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - --extra-keys
          - metadata.language_info.version metadata.vscode
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
        args:
          - --wrap
          - '88'
        files: (AGENTS\.md|CLAUDE\.md|README\.md)
      - id: mdformat
        additional_dependencies:
          - mdformat-myst
          - mdformat-ruff
        args:
          - --wrap
          - '88'
        files: (docs/.)
        # mdformat-myst mangles sphinx-design grid-item-card directives
        exclude: docs/index\.md
  - repo: local
    hooks:
      # Gates the bare ruler only — a comment line that is nothing but fill
      # characters. A titled `# --- Section ---`, a ruler under ten fill
      # characters, and a ruler in a notebook or a Markdown file all stay a
      # review responsibility; docstring underlines carry no `#` and are not
      # in scope.
      #
      # Override, where a ruler earns its place: state the reason on the ruler
      # line itself, e.g. `# ---- 8< ---- everything below is generated`. The
      # line stops being decoration and the reason lands in the diff, so the
      # override is self-documenting. `SKIP=no-section-separator-comments git
      # commit …` also works but drops the hook from the run *without printing
      # a line for it*, leaving no record; if you use it, put the reason in the
      # commit message.
      - id: no-section-separator-comments
        name: no decorative section-separator comments
        language: pygrep
        entry: ^\s*#\s*[-=#_*]{10,}\s*$
        types:
          - python
      # A custom JVP that reads its tangents is not *automatically*
      # transposable, and JAX says so: "Transpose rule ... not implemented".
      # That is a missing rule, not a missing transpose — the differential of a
      # finite affine segment is linear and its transpose is the coefficient
      # vector, and bit-level scaling by a power of two is the same linear map
      # as multiplying by it. Documenting the refusal as a mathematical
      # impossibility has been written and corrected repeatedly, so the claim
      # is gated here rather than left to review.
      #
      # Say what is true instead: "carries no transpose rule", "no reverse rule
      # is registered", "not automatically transposable" — all of which pass.
      # A map that genuinely has no transpose is nonlinear, and saying which
      # nonlinearity rewrites the sentence anyway. `SKIP=no-impossible-transpose
      # git commit …` drops the hook without printing a line for it, so put the
      # reason in the commit message if you use it.
      #
      # Line-scoped, like its siblings: a claim split across two lines by the
      # formatter is not caught and stays a review responsibility.
      - id: no-impossible-transpose
        name: no claim that a linear map has no transpose
        language: pygrep
        entry: (?i:\b(?:has|have|had)\s+no\s+transpose\b(?!\s+rule))|(?i:\b(?:does|do|did)\s+not\s+have\s+an?\s+transpose\b)|(?i:\bnothing\s+to\s+transpose\b)|(?i:\bnone\s+to\s+transpose\b)|(?i:\bno\s+map\s+to\s+transpose\b)
        types_or:
          - python
          - markdown
      # Catches the labelled forms only — PR/issue numbers, `E<n>`/`F<n>`
      # finding labels, `round-<n>`, `pre-fix`. Prose that rehearses history
      # without a label stays a review responsibility.
      - id: no-internal-references
        name: no references a reader cannot reach from the checkout
        language: pygrep
        entry: (?:^|[\s(\[])\#[0-9]{2,5}\b(?!\.[0-9])|(?i:\b(?:round|wave)-[0-9]+\b)|(?i:\b(?:audit|review|finding|witness|defect|bug|fix|guard)\s+)(?:finding\s+)?[EF][0-9]{1,2}\b|\b[EF][0-9]{1,2}(?i:\s+(?:fix|guard|bug|defect|witness|signature|regression|finding|audit)\b)|(?:^|\s)\((?:the\s+)?(?!(?:F8|F16|F32|F64)\b)[EF][0-9]{1,2}['’]?(?:\s*[,/]\s*[EF][0-9]{1,2}['’]?)*(?:[,)\s])|(?i:\b(?:pre|post)-fix\b)
        types:
          - python
ci:
  autoupdate_schedule: monthly
  # pre-commit.ci has no pixi environments and blocks network at hook runtime;
  # the GitHub Actions run-ty job covers type checking.
  skip:
    - ty
