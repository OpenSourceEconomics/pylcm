---
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: '3.14'
    nodejs: '20'
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      # `--frozen` installs straight from the lock. Re-solving on the builder
      # pulls in the cuda environment, whose `__cuda` virtual package the
      # CPU-only RTD host cannot satisfy, and the build dies initializing a
      # dispatch it never needed. Lock drift then fails fast and legibly here
      # rather than as that dispatch error.
      - pixi install -e docs --frozen
    post_build:
      # Jupyter Book 2.0 builds site content to _build/html.
      # For ReadTheDocs, we build and then copy to the expected output location.
      - mkdir --parents $READTHEDOCS_OUTPUT/html/
      - >-
        BASE_URL="/$READTHEDOCS_LANGUAGE/$READTHEDOCS_VERSION"
        pixi run -e docs build-docs
      - cp -a docs/_build/html/. "$READTHEDOCS_OUTPUT/html" && rm -r docs/_build
